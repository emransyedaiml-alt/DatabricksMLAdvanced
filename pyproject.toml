[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-enterprise-genai-agentic-ai"
version = "0.1.0"
description = "Enterprise Intelligent Knowledge Assistant: RAG (Stage A) and an Agentic Data Engineering Assistant (Stage B) on Azure Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pypdf>=4.2,<6",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40,<1", "databricks-vectorsearch>=0.44,<1", "mlflow>=2.20,<4"]
app = ["streamlit>=1.40,<2"]
adf = ["azure-identity>=1.19,<2", "azure-mgmt-datafactory>=9,<10"]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
